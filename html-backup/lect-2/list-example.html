<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>List example</h1>
    <h2>Ordered List or Numbered List (ol)</h2>
    <ol type="1">
        <li>Apple</li>
        <li>Banana</li>
        <li>Kiwi</li>
    </ol>
    <h2>Unordered List or Bulleted List (ul)</h2>
    <ul type="circle">
        <li>Apple</li>
        <li>Banana</li>
        <li>Kiwi</li>
    </ul>
    <h2>Description List or Definition List (dl)</h2>
    <dl>
        <dt>Varible:</dt>
        <dd>varible is used to store value</dd>
    </dl>
</body>
</html>
