<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1 align="center">Form Example</h1>
     <form >
          <table align="center" border="1" cellspacing="10px" cellpadding="10px">
           <tr>
            <th>Enter Name</th>
            <td><input type="text" name="" id="" required placeholder="Enter your name" disabled></td>
            <th>Enter Email</th>
            <td><input type="email" name="" id="" required></td>
           </tr>
           <tr>
              <th>Password</th>
              <td>
                <input type="password" name="" id="">
              </td>
              <th>DOB</th>
              <td>
                <input type="date" name="" id="">
              </td>
           </tr>
           <tr>
              <th>Gender</th>
              <td>
                <input type="radio" name="gender" id="">Male
                <input type="radio" name="gender" id="">Female
              </td>
              <th>Hobby</th>
              <td>
                <input type="checkbox" name="" id="">Music
                <input type="checkbox" name="" id="">Dance
                <input type="checkbox" name="" id="">Sports
              </td>
           </tr>
           <tr>
                <th>Address</th>
                <td><textarea name="" id=""></textarea></td>
                <th>City</th>
                <td>
                    <select name="" id="">
                        <option value="">----select-----</option>
                        <option value="">Surat</option>
                        <option value="">Vadodra</option>
                        <option value="">Vapi</option>
                    </select>
                </td>
           </tr>
           <tr>
            <td colspan="4" align="center">
                <input type="submit" value="Submit" >
            </td>
           </tr>
     </table>
     </form>
</body>
</html>
