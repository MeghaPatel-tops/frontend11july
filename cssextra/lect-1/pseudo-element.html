<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p::first-letter{
            font-size: 4em;
        }
        p::first-line{
            color: red;
        }
        h1::before{
            content: '★';
        }
        h1::after{
            content: '★';
        }
        p::selection{
            background-color: black;
            color: white;
        }

        #txt1::placeholder{
            color: blue;
        }

    </style>
</head>
<body>
    <h1>Pseudo elements</h1>
    <p>Lorem ipsum dolor sit amet consectetur,
        <br> adipisicing elit. Facilis sunt iure non vel quisquam ad dicta, deleniti cumque aliquid error similique sit distinctio a nostrum inventore dolores exercitationem officiis quidem?</p>
        <input type="text" name="" id="txt1" placeholder="Enter yor name">
</body>
</html>
