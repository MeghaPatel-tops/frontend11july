<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            gap:20px;   
            height: 400px;
            background-color: gray;
            align-items: start;
        }
        .box{
             padding: 20px;
            background-color: red;
        }
        #box-3{
            flex-grow: 3;
        }
         #box-2{
            flex-grow: 2;
            align-self: flex-end;
        }
         #box-4{
            
            align-self: flex-end;
        }
        #box-1{
            flex-shrink: 2;
            /* flex-grow: 1;  */
        }
        /* #box-1{
            flex-shrink: 2;
        }  */
          #box-1{
            flex-basis: 400px;
          }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1">Box-1</div>
        <div class="box" id="box-2">Box-2</div>
        <div class="box" id="box-3">Box-3</div>
        <div class="box" id="box-4">Box-4</div>
    </div>
</body>
</html>
