<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .row{
            background-color: rgb(206, 191, 171);
            padding: 100px;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;

        }
        .col{
            background-color: rgb(144, 100, 107);
            border-radius: 20px;
            padding: 100px;

        }
         .col:hover{
             transform: rotate(5deg);
         }
    </style>
</head>
<body>
    <div class="row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
    </div>
</body>
</html>
