<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            padding: 20px;
            background-color: rgb(136, 130, 130);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 200px 400px 100px;
            /* column-gap: 20px;
            row-gap: 30px; */
            gap:20px;
        }
        .box{
            padding: 20px 30px;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box-1">1</div>
        <div class="box" id="box-2">2</div>
        <div class="box" id="box-3">3</div>
        <div class="box" id="box-7">7</div>
        <div class="box" id="box-4">4</div>
        <div class="box" id="box-5">5</div>
        <div class="box" id="box-6">6</div>
       
    </div>
    
</body>
</html>
