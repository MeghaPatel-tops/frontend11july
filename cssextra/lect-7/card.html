<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
             height: 500px;
             display: flex;
             justify-content: center;
             align-items: center;
        }
        .card{
            width: 300px;
            border: 3px solid green;
            padding: 10px;
            border-radius: 20px;
        }
        .card-img{
            padding-bottom: 20px;
        }
        .card-img img{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        .card-text{
            color:gray;
        }
        .card-button{
            padding: 10px 0px;
            text-align: center;
        }
        button{
            padding: 5px 10px;
            background-color: green;
            border: 2px solid white;
            color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-img">
            <img src="../lect-2/OIP.jpeg" alt="">
        </div>
        <div class="card-text">
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Earum saepe sit aliquid repellat minima, praesentium nobis dignissimos rem maiores iure ab quaerat, voluptatum possimus, eos aspernatur omnis optio fuga perspiciatis.</p>
        </div>
        <div class="card-button">
            <button>Learn More</button>
        </div>
    </div>
</body>
</html>
