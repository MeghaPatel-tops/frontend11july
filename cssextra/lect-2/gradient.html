<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 400px;
            width: 100%;
            border: 1px solid black;
        }
        #box-1{
            background: linear-gradient(to left,red,rgb(153, 103, 103));
        }
        #box-2{
            background:radial-gradient(red,rgb(153, 103, 103),yellow)
        }
         #box-3{
            background:conic-gradient(red,rgb(153, 103, 103),yellow)
        }
    </style>
</head>
<body>
    <div class="box" id="box-1"></div>
    <div class="box" id="box-2"></div>
    <div class="box" id="box-3"></div>
</body>
</html>
