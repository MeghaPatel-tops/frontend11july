<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            width: 200px;
            background-color: rgb(14, 14, 49);
            color: white;
              display: flex;
              flex-direction: column;
           
        }
        .logodiv{
            text-align: center;
             
             padding: 20px 0px;
        }
        .logodiv label{
            
              font-size: 2em;
              font-weight: bolder;
        }
        ul{
            padding: 0px 0px;
        }
       
        li{
           padding: 10px 0px;
            text-align: center;
            list-style: none;
           border-bottom: 1px solid white;
         
        }
        li:nth-child(1){
             border-top: 1px solid white;
        }
        li:hover{
            background-color: white;
            color:rgb(14, 14, 49) ;
        }
    </style>
</head>
<body>
    
    <nav>
        <div class="logodiv">
            <label for="">Navbar</label>
        </div>
        <ul>
            
            <li>Nav-items-1</li>
            <li>Nav-items-2</li>
            <li>Nav-items-3</li>
            <li>Nav-items-4</li>
            <li>Nav-items-5</li>
            <li>Nav-items-6</li>
            <li>Nav-items-7</li>
        </ul>
    </nav>
</body>
</html>
