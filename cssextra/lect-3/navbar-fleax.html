    <title>Document</title>
    <style>

        li:hover{

        }

</head>

    <nav>
        <div class="logodiv">
            <label for="">Navbar</label>
        </div>
        <ul>
            <li>Nav-items-1</li>
            <li>Nav-items-2</li>
            <li>Nav-items-3</li>
            <li>Nav-items-4</li>
            <li>Nav-items-5</li>

</html>
