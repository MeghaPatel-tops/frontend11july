<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Types of list in html</h1>
    <h2>Unordered list</h2>
    <ul type="square">
        <li>Apple</li>
        <li>Banana</li>
        <li>Kiwi</li>
    </ul>
    <h2>Ordered list</h2>
    <ol type="i">
        <li>Apple</li>
        <li>Banana</li>
        <li>Kiwi</li>
    </ol>
    <h2>Description list</h2>
    <dl>
        <dt>Html:</dt>
        <dd>Html is hypertext markup lamguage</dd>
    </dl>
</body>
</html>
